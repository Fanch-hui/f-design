interface:
  display_name: "F-design"
  short_description: "Choice-led frontend design, implementation, motion, and browser QA"
  default_prompt: "Use $f-design as the complete frontend workflow: before analysis, let me choose design-then-generate-reference, design-then-build-directly, a page-scoped hybrid, custom mode, or delegation; keep optional reference input separate from generated output; let me choose or delegate architecture; ask guided questions with free-form choices and a separate additional-requirements prompt; complete and approve the design package before any optional page-image generation; skip generated-reference artifacts and comparison for direct pages; then implement and verify responsive, accessibility, motion, and browser quality without silent phase skips."
