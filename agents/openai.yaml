interface:
  display_name: "F-design"
  short_description: "Choice-led product structure, UI, motion, and browser QA"
  default_prompt: "Use $f-design as the complete frontend workflow. For any greenfield or material design task, after only a factual scan, stop and make delivery mode the first visible standalone question: design-then-generate-reference, design-then-build-directly, page-scoped hybrid, custom, or explicit delegation. Never infer direct mode from an empty repo, no external reference, urgency, limited scope, or missing image tools. Keep reference input separate, then ask architecture and guided questions with free-form choices plus additional requirements. Classify every material surface by its primary job. When structure is unresolved, compare two or three genuinely different product-grounded directions, reject style-only variants and novelty without task value, retain a low-risk fit, and record user selection or delegation before the Design Package. Complete the selected design before optional image generation, and verify responsive, accessibility, motion, structural convergence, and browser quality."
