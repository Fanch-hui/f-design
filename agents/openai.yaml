interface:
  display_name: "F-design"
  short_description: "Accountable frontend design, components, motion, and browser QA"
  default_prompt: "Use $f-design as the complete frontend workflow: before analysis, offer optional reference upload, website URL, current-page, no-reference, and custom paths without requiring a reference; let me choose or delegate the experience and technical architecture, ask guided questions with free-form choices and a separate additional-requirements prompt, calibrate expressive variance, information density, and motion energy from the product's real subject, keep one desktop/mobile content canon and governed design system, record component and motion decisions, implement without silent phase skips, and verify the rendered result in a real browser."
