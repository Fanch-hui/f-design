interface:
  display_name: "F-design"
  short_description: "Choice-led frontend design, implementation, motion, and browser QA"
  default_prompt: "Use $f-design as the complete frontend workflow. For any greenfield or material design task, after only a factual scan, stop and make delivery mode the first visible standalone question: design-then-generate-reference, design-then-build-directly, page-scoped hybrid, custom, or explicit delegation. Never infer direct mode from an empty repo, no external reference, urgency, limited scope, or missing image tools. Keep reference input separate, then ask architecture and guided questions with free-form choices plus additional requirements. Complete the design package before optional image generation, and verify responsive, accessibility, motion, and browser quality."
